[project]
name = "podcast-server"
version = "0.1.0"
description = "Starling multi-speaker 'podcast' TTS server (VibeVoice-1.5B via Hugging Face transformers)"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.34",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "numpy>=1.26",
]

[project.optional-dependencies]
# GPU inference stack. torch itself is installed by init.sh from the CUDA
# wheel index (RTX 50xx / sm_120 needs CUDA >= 12.8 wheels), so it is not
# listed here — a plain PyPI resolve could swap in a different build.
gpu = [
    "transformers==5.19.0",
    "diffusers==0.41.0",
    "accelerate>=1.0",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "httpx>=0.27",
]

[project.scripts]
podcast-server = "podcast_server.main:run"
podcast-tts = "podcast_server.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["podcast_server*"]
